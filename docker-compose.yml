services:
  mysql:
    image: "mysql:8-oracle"
    ports:
      - "3307:3306"
    # network_mode: "host"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=social_media_database
      - MYSQL_USER=social_media_database
      - MYSQL_PASSWORD=root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - "./db-setup/init.sql:/docker-entrypoint-initdb.d/1.sql"
